services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction_app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: construction_db
      DB_USERNAME: construction_user
      DB_PASSWORD: construction_password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: construction_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction_db
      POSTGRES_USER: construction_user
      POSTGRES_PASSWORD: construction_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction_user -d construction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: